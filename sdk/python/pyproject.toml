[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultkey"
version = "0.1.0"
description = "Python SDK for VaultKey secure secrets manager"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["vaultkey", "secrets", "secrets-manager", "security", "env"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/chromabeast/vaultkey"
Repository = "https://github.com/chromabeast/vaultkey"
Issues = "https://github.com/chromabeast/vaultkey/issues"

[tool.setuptools]
packages = ["vaultkey"]
