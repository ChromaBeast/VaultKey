name: Build & Release CLI Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Build Binaries
        run: |
          mkdir -p bin
          LDFLAGS="-s -w -X vaultkey/internal/version.Version=${{ github.ref_name }}"
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/vaultkey-windows-amd64.exe ./cmd/vaultkey
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/server-windows-amd64.exe ./cmd/server
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/vaultkey-linux-amd64 ./cmd/vaultkey
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/vaultkey-linux-arm64 ./cmd/vaultkey
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/server-linux-amd64 ./cmd/server
          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/vaultkey-darwin-amd64 ./cmd/vaultkey
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/vaultkey-darwin-arm64 ./cmd/vaultkey

      - name: Generate SHA256 Checksums
        run: |
          cd bin
          sha256sum vaultkey-* server-* > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
