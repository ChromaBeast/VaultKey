name: Build & Release CLI Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node & Build Web
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Binaries
        run: |
          mkdir -p bin
          # Windows
          GOOS=windows GOARCH=amd64 go build -o bin/vaultkey-windows-amd64.exe ./cmd/vaultkey
          GOOS=windows GOARCH=amd64 go build -o bin/server-windows-amd64.exe ./cmd/server
          # Linux
          GOOS=linux GOARCH=amd64 go build -o bin/vaultkey-linux-amd64 ./cmd/vaultkey
          GOOS=linux GOARCH=arm64 go build -o bin/vaultkey-linux-arm64 ./cmd/vaultkey
          GOOS=linux GOARCH=amd64 go build -o bin/server-linux-amd64 ./cmd/server
          # macOS
          GOOS=darwin GOARCH=amd64 go build -o bin/vaultkey-darwin-amd64 ./cmd/vaultkey
          GOOS=darwin GOARCH=arm64 go build -o bin/vaultkey-darwin-arm64 ./cmd/vaultkey

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
