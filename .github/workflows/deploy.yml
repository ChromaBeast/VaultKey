name: VaultKey CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chromabeast/vaultkey

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Tests (runs on every push & PR)
  # ─────────────────────────────────────────────
  test:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web Frontend
        run: cd web && bun install --frozen-lockfile && bun run lint && bun run build

      - name: Run Backend Tests
        run: go test ./... -v

      - name: Vet
        run: go vet ./...

  # ─────────────────────────────────────────────
  # Job 2: Build & push image to ghcr.io
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web Frontend
        run: cd web && bun install --frozen-lockfile && bun run lint && bun run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=sha-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # ─────────────────────────────────────────────
  # Job 3: Instant SSH Deployment (Fallback to Watchtower)
  # ─────────────────────────────────────────────
  deploy-to-vps:
    name: Instant VPS Deployment
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Config
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "SSH secrets not set, relying on Watchtower auto-poll."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_rsa\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 15\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USERNAME || 'ubuntu' }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: SSH Pull & Restart
        run: |
          ssh vps "cd /opt/vaultkey && docker pull ghcr.io/chromabeast/vaultkey:latest && docker compose up -d" || true
