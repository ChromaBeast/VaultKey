name: VaultKey CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chromabeast/vaultkey

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Tests (runs on every push & PR)
  # ─────────────────────────────────────────────
  test:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: cd web && npm ci && npm run build

      - name: Run Backend Tests
        run: go test ./... -v

  # ─────────────────────────────────────────────
  # Job 2: Build Docker image & push to ghcr.io
  # ─────────────────────────────────────────────
  build-image:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web & Compile Linux Binary
        run: |
          cd web && npm ci && npm run build && cd ..
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server ./cmd/server

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # ─────────────────────────────────────────────
  # Job 3: SSH into VPS — pull image & restart
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_rsa\n  StrictHostKeyChecking no\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n  ConnectTimeout 30\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USERNAME }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Bootstrap VPS (idempotent)
        run: ssh vps "sudo mkdir -p /opt/vaultkey/data && sudo chown -R \$(whoami) /opt/vaultkey"

      - name: Copy Config Files to VPS
        run: scp -F ~/.ssh/config docker-compose.yml Caddyfile vaultkey.yaml vps:/opt/vaultkey/

      - name: Pull Image & Restart Containers
        run: |
          # Build deploy script with secrets injected at render time (runner-side)
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          GHCR_TOKEN="__TOKEN__"
          ACTOR="__ACTOR__"

          echo "==> Logging into ghcr.io"
          echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${ACTOR}" --password-stdin 2>&1

          echo "==> Pulling latest image"
          sudo docker pull ghcr.io/chromabeast/vaultkey:latest

          echo "==> Restarting containers"
          cd /opt/vaultkey
          sudo docker compose up -d --no-build --remove-orphans

          echo "==> Cleaning up old images"
          sudo docker image prune -f

          echo ""
          echo "==> Deployment complete. Running containers:"
          sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          SCRIPT

          # Inject secrets into the script (no secrets in env, injected as string literals)
          sed -i "s|__TOKEN__|${{ secrets.GITHUB_TOKEN }}|g" /tmp/deploy.sh
          sed -i "s|__ACTOR__|${{ github.actor }}|g" /tmp/deploy.sh

          # Stream the script to the VPS via SSH stdin
          ssh vps 'bash -s' < /tmp/deploy.sh
