name: VaultKey CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chromabeast/vaultkey

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Tests (runs on every push & PR)
  # ─────────────────────────────────────────────
  test:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: cd web && npm ci && npm run build

      - name: Run Backend Tests
        run: go test ./... -v

  # ─────────────────────────────────────────────
  # Job 2: Build & push image → Watchtower
  #         auto-deploys to VPS within 5 min
  # ─────────────────────────────────────────────
  build-and-deploy:
    name: Build & Push Image (Auto-deploys via Watchtower)
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web & Compile Linux Binary
        run: |
          cd web && npm ci && npm run build && cd ..
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server ./cmd/server

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deployment Summary
        run: |
          echo "✅ Image pushed to ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "🔄 Watchtower will auto-pull & restart VPS containers within 5 minutes"
