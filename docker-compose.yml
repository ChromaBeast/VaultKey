services:
  # ── Backend API (Go) ──────────────────────────────────────
  vaultkey:
    image: ghcr.io/chromabeast/vaultkey-server:latest
    container_name: vaultkey
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/var/lib/vaultkey
    environment:
      VAULTKEY_ENV: production
      VAULTKEY_PORT: "8080"
      VAULTKEY_DB_PATH: /var/lib/vaultkey/vaultkey.db
      VAULTKEY_AUTO_LOCK: 30m
      VAULTKEY_HMAC_KEY: "${VAULTKEY_HMAC_KEY:?set VAULTKEY_HMAC_KEY in .env (see .env.example)}"
      VAULTKEY_TRUSTED_PROXIES: "127.0.0.1"
      VAULTKEY_DOMAIN: "${VAULTKEY_DOMAIN:-localhost}"
      VAULTKEY_ALLOWED_ORIGINS: "${VAULTKEY_ALLOWED_ORIGINS:-}"
      # API-only: no VAULTKEY_STATIC_DIR — web UI served by the web container
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-brevo}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-VaultKey Security}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Frontend web UI (nginx + static build) ────────────────
  web:
    image: ghcr.io/chromabeast/vaultkey-web:latest
    container_name: vaultkey_web
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: vaultkey_watchtower
    command: --label-enable --interval 300
    environment:
      # Docker 28+ (server API 1.52) rejects watchtower's default client API
      # 1.25; pin a compatible API version so auto-updates keep working.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: vaultkey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VAULTKEY_DOMAIN: ${VAULTKEY_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      vaultkey:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
