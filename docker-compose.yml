version: '3.8'

services:
  vaultkey:
    image: ghcr.io/chromabeast/vaultkey:latest
    container_name: vaultkey
    ports:
      - "8080:8080"
    volumes:
      - ./data:/var/lib/vaultkey
    environment:
      - VAULTKEY_PORT=8080
      - VAULTKEY_DB_PATH=/var/lib/vaultkey/vaultkey.db
      - VAULTKEY_AUTO_LOCK=30m
      - VAULTKEY_AUDIT_SIGNING_KEY=prod-vaultkey-hmac-audit-signing-secret-key-change-me
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: vaultkey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vaultkey

  # Watchtower: auto-detects new ghcr.io image pushes and restarts vaultkey
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: vaultkey_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300      # check every 5 minutes
      - WATCHTOWER_CLEANUP=true           # remove old images automatically
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_SCOPE=vaultkey         # only watch containers with this scope label
    command: --interval 300 vaultkey      # only watch the vaultkey container

volumes:
  caddy_data:
  caddy_config:
