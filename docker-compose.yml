services:
  vaultkey:
    image: ghcr.io/chromabeast/vaultkey:latest
    container_name: vaultkey
    ports:
      - "8080:8080"
    volumes:
      - ./data:/var/lib/vaultkey
    environment:
      - VAULTKEY_PORT=8080
      - VAULTKEY_DB_PATH=/var/lib/vaultkey/vaultkey.db
      - VAULTKEY_AUTO_LOCK=30m
      - VAULTKEY_AUDIT_SIGNING_KEY=prod-vaultkey-hmac-audit-signing-secret-key-change-me
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: vaultkey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vaultkey

  # Watchtower: auto-detects new ghcr.io image pushes and restarts vaultkey
  # Uses host Docker socket to watch and update the vaultkey container
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: vaultkey_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: vaultkey

volumes:
  caddy_data:
  caddy_config:
